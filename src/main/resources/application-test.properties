spring.application.name=book-vault



spring.datasource.url=jdbc:h2:mem:bookvault-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=always

# JSON
spring.jackson.default-property-inclusion=non_null

# JWT
app.jwt.secret=bookvault-super-secret-jwt-signing-key-must-be-at-least-32-chars
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.solvative.book_vault=INFO

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
